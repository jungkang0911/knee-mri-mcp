[project]
name = "knee-mcp"
version = "0.1.0"
description = "Remote MCP server for knee MRI / X-ray images in Google Drive, with burned-in PII masking"
requires-python = ">=3.10"
dependencies = [
  "mcp>=2.3,<3",
  "pillow>=10.1",
  "pytesseract>=0.3.10",
  "google-api-python-client>=2.100",
  "google-auth>=2.20",
  "google-auth-oauthlib>=1.0",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
knee-mcp = "knee_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["knee_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
